id: P-001
title: Не могу прикинуть, потяну ли я дом у этой компании
status: open
context: homepage / блоки «Бюджет и смета», «Готовые проекты»
audience: частный заказчик на этапе выбора подрядчика, сравнивает 3–5 компаний
job: "Понять порядок цен, чтобы решить, стоит ли вообще звонить"
observation: >
  На главной нет ни одной цифры или диапазона. Есть обещание «полного бюджета
  до старта» и «уменьшенной стоимости» готовых проектов, но без ориентира.
  Чтобы узнать цену, нужно оставить заявку, а это высокий порог на раннем этапе.
tags: [budget-clarity, trust]
severity: high
evidence:
  - type: expert
    note: аудит главной, ноябрь 2026
  - type: analytics
    note: "[уточнить у клиента: доля заявок с вопросом о цене]"
metric: "Доля заявок, где первый вопрос менеджеру про цену, снижается"
constraints:
  - цены даются диапазоном «от», не обещанием (см. invariants/must_not)
