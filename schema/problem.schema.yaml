# Язык описания проблем, версия 0.2
# Минимум обязательных полей, всё остальное опционально.
# Принцип: проблема описывает ситуацию пользователя, а не решение.
# "Нет кнопки X" плохо. "Не понимает, что будет после клика" хорошо.

required:
  id:          "P-NNN"
  title:       "Одна фраза с точки зрения пользователя"
  status:      "open | in-progress | solved | proposed | wontfix"
  context:     "Страница / блок, где проблема проявляется"
  audience:    "Кто страдает (ссылка на сегмент или короткое описание)"
  job:         "Что человек пытается сделать в этот момент, его словами"
  observation: "Что именно сейчас мешает"
  tags:        "Список из tags.yaml проекта, по ним ищутся паттерны"
  severity:    "low | medium | high"

optional:
  baseline:    "По какой версии страницы описано: живой сайт на дату, концепт, ветка. Иначе агент не поймёт, где искать блоки из context"
  evidence:    "Список {type: expert|analytics|heatmap|interview|support, note: ...}"
  metric:      "Как поймём, что решено"
  constraints: "Ограничения именно этой проблемы (общие лежат в invariants/)"
  related:     "Другие P-ид"
