<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Stat</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9afbdd1d3a7a2ca396776f528a834ba2">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 8px; font-family: var(--font-body); line-height: 1.55">
<div style="font-family: var(--font-display); font-weight: 500; line-height: 1; font-size: {{size}}; color: {{valueColor}}">{{value}}</div>
<div style="font-size: {{labelSize}}; color: {{labelColor}}">{{label}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"text","default":"100+"},"label":{"editor":"text","default":"построенных домов"},"tone":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":280,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.tone ?? 'light') === 'dark';
    return {
      value: this.props.value ?? '100+', label: this.props.label ?? 'построенных домов',
      size: dark ? '40px' : '56px', labelSize: dark ? '14px' : '16px',
      valueColor: dark ? 'var(--color-text-inverse)' : 'var(--color-accent-large)',
      labelColor: dark ? 'var(--color-text-inverse-secondary)' : 'var(--color-text-secondary)'
    };
  }
}
</script>
</body>
</html>
