<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProjectCard</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9afbdd1d3a7a2ca396776f528a834ba2">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<a href="{{href}}" style="text-decoration: none; color: var(--color-text-primary); display: flex; flex-direction: column; gap: 18px; font-family: var(--font-body)">
<div style="position: relative">
<dc-import name="Placeholder" label="{{photoLabel}}" height="{{ 300 }}" hint-size="100%,300px"></dc-import>
<div style="position: absolute; top: 16px; left: 16px"><dc-import name="Badge" label="{{status}}" hint-size="140px,32px"></dc-import></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 20px; line-height: 1.25">{{heading}}</h3>
<div style="display: flex; gap: 20px; font-size: 15px; line-height: 1.55; color: var(--color-text-secondary); border-top: 1px solid var(--color-border-divider); padding-top: 12px">
<span><b style="font-weight: 700; color: var(--color-text-primary)">{{area}}</b> м²</span>
<span><b style="font-weight: 700; color: var(--color-text-primary)">{{floors}}</b> {{floorsLabel}}</span>
<span style="margin-left: auto; font-weight: 600; color: var(--color-text-primary)">Подробнее →</span>
</div>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading":{"editor":"text","default":"Дом на склоне"},"status":{"editor":"text","default":"Построен в 2022"},"area":{"editor":"text","default":"220"},"floors":{"editor":"text","default":"3"},"floorsLabel":{"editor":"text","default":"этажа"},"href":{"editor":"text","default":"#projects"},"$preview":{"width":389,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const h = this.props.heading ?? 'Дом на склоне';
    return {
      heading: h, photoLabel: '[ Фото: ' + h + ' ]',
      status: this.props.status ?? 'Построен в 2022',
      area: this.props.area ?? '220', floors: this.props.floors ?? '3',
      floorsLabel: this.props.floorsLabel ?? 'этажа',
      href: this.props.href ?? '#projects'
    };
  }
}
</script>
</body>
</html>
