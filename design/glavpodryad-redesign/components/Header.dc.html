<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9afbdd1d3a7a2ca396776f528a834ba2">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header class="gp-inverse" style="width: 100%; background: var(--color-bg-inverse); color: var(--color-text-inverse); border-bottom: 1px solid var(--color-border-divider-inverse); font-family: var(--font-body)">
<div style="max-width: var(--size-container); margin: 0 auto; padding: 20px var(--space-page-gutter); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
<dc-import name="Logo" inverse="{{ true }}" hint-size="220px,40px"></dc-import>
<nav aria-label="Основное меню" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 15px; font-weight: 500">
<sc-for list="{{nav}}" as="item" hint-placeholder-count="6"><a href="{{item.href}}" style="text-decoration: none">{{item.label}}</a></sc-for>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<a href="tel:+78632098464" style="text-decoration: none; font-weight: 700; font-size: 16px">+7 (863) 209-84-64</a>
<dc-import name="Button" label="Оставить заявку" href="#form" size="sm" hint-size="180px,44px"></dc-import>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    return { nav: [
      { label: 'О компании', href: '#about' }, { label: 'Наши объекты', href: '#projects' },
      { label: 'Услуги', href: '#services' }, { label: 'Документы', href: '#docs' },
      { label: 'Контакты', href: '#contacts' }, { label: 'Блог', href: '#blog' }
    ] };
  }
}
</script>
</body>
</html>
