# Сущность компании. Редизайн это не меняет.
# Принцип проекта: "редизайн без изменения сущности".

positioning:
  what:  "Строительство загородных домов под ключ"
  where: "Ростовская область"
  promise: "Ответственность за результат, прозрачность бюджета и хода работ"

voice:
  - спокойный, уверенный, без крика и восклицательных знаков
  - говорим фактами и цифрами, а не эпитетами
  - обращение на «вы»

must_keep:
  - логотип и фирменный цвет [уточнить у клиента]
  - видео реальных объектов в первом экране [уточнить у клиента: оставляем ли]
  - личный кабинет клиента как отличие от конкурентов
  - каналы связи: телефон, WhatsApp, Telegram

must_not:
  - превращать сайт в каталог «дешёвых домов»: компания не про самый низкий ценник
  - использовать стоковые фото домов вместо своих объектов
  - добавлять факты (цифры, сроки, гарантии), которых нет у клиента

facts_source_of_truth:
  # Единый источник цифр. Все блоки берут значения отсюда.
  founded: "[уточнить у клиента: 2006 или позже]"
  houses_built: "100+"
  crews: "6+"
  clients: "90+"
  office: "Ростов-на-Дону, пр. Кировский, 53"
  hours: "Пн–Сб 9:00–20:00"
