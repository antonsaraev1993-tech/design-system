name: check
on: [push, pull_request]
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check.py template
      - run: python3 scripts/check.py examples/glavpodryad
      - run: python3 examples/glavpodryad/check_site.py
