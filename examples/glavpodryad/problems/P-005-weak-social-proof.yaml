id: P-005
title: Не вижу, что другим людям здесь уже построили хорошо
status: open
context: homepage / «О компании», «Партнёры»
baseline: живой сайт glavpodryad.pro, ноябрь 2026 (до редизайна)
audience: заказчик на этапе сравнения подрядчиков
job: "Найти подтверждение от реальных клиентов, а не от самой компании"
observation: >
  «90+ довольных клиентов» ничем не подкреплено: нет отзывов, имён, историй.
  Партнёры показаны логотипами без названий. Объекты есть, но без истории
  заказчика.
tags: [social-proof, trust]
severity: medium
evidence:
  - type: expert
    note: аудит главной, ноябрь 2026
constraints:
  - только реальные отзывы с согласия клиентов [уточнить у клиента: что есть]
